<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バランスルーレット画面</title>
<link rel="stylesheet" href="../css/common.css">
<style>
  /* ---- デザイン比較用の変数（既定値＝現行デザイン） ---- */
  :root {
    --block-a: #2a2a2a;
    --block-b: #0a0a0a;
    --block-border: rgba(255, 255, 255, 0.25);
    --settings-a: #232a70;
    --settings-b: #141845;
    --ring-core: #10143a;
  }

  body { overflow: hidden; }
  main {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: minmax(220px, 340px) 1fr;
    gap: 12px;
    padding: 12px;
  }

  .block {
    background: linear-gradient(160deg, var(--block-a), var(--block-b));
    border: 1px solid var(--block-border);
    border-radius: 12px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  .block.click { cursor: pointer; user-select: none; transition: filter .12s ease, transform .08s ease; }
  .block.click:hover { filter: brightness(1.1); }
  .block.click:active { transform: translateY(2px); }
  .block.click:disabled { opacity: .45; cursor: not-allowed; filter: none; }

  /* ---- 左：タイマー / ジャンル / 進むマス / 設定・読み込み ---- */
  .left-col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }

  .board-image {
    width: 100%; max-height: 100px;
    object-fit: contain;
    flex: 0 0 auto;
  }

  /* リング型：残り時間を円弧の減り具合で表現する */
  .timer-block { display: flex; flex-direction: column; align-items: center; gap: 14px; flex: 0 0 auto; padding: 14px 0 2px; }

  .timer-ring {
    --pct: 100%;
    --ring-color: var(--accent);
    width: min(92%, 200px);
    aspect-ratio: 1;
    border-radius: 50%;
    background:
      radial-gradient(closest-side, var(--ring-core) 76%, transparent 77% 100%),
      conic-gradient(var(--ring-color) 0% var(--pct), rgba(255, 255, 255, 0.14) var(--pct) 100%);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.3s ease;
  }
  .timer-ring-inner {
    font-family: "Bahnschrift", "Segoe UI", system-ui, sans-serif;
    font-variation-settings: "wght" 700, "wdth" 68;
    font-size: clamp(44px, 7.5vw, 66px); font-weight: 700; letter-spacing: -0.09em;
    font-variant-numeric: tabular-nums;
    color: #fff;
  }
  .timer-ring.warn { --ring-color: #ffd54a; }
  .timer-ring.warn .timer-ring-inner { color: #ffd54a; }
  .timer-ring.danger { --ring-color: #ff6b6b; }
  .timer-ring.danger .timer-ring-inner { color: #ff6b6b; }

  .timer-btns { display: grid; grid-template-columns: 1fr 1fr 1.4fr 1.2fr; gap: 6px; width: 100%; height: 40px; }
  .timer-btns .block { font-weight: 800; font-size: 18px; border-radius: 8px; }

  .genre-box { font-size: clamp(20px, 2.6vw, 28px); font-weight: 800; flex: 0 0 auto; height: 64px; }

  /* ---- 進むマス：1〜4の目を持つ3Dキューブ ---- */
  .result-box {
    font-size: clamp(24px, 3.4vw, 36px); font-weight: 900;
    flex-direction: column; gap: 8px;
    flex: 1 1 auto; min-height: 90px;
  }
  .result-box .placeholder { line-height: 1.3; }

  .dice-scene {
    width: 84px; height: 84px;
    perspective: 600px;
  }
  .dice-cube {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 1.1s cubic-bezier(.15, .8, .25, 1);
  }
  .dice-face {
    position: absolute; inset: 0;
    background: #fff; border-radius: 12px;
    box-shadow: inset 0 0 0 3px rgba(0,0,0,.12), 0 6px 14px rgba(0,0,0,.35);
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    padding: 14%;
    transform: rotateY(var(--deg)) translateZ(42px);
  }
  .dice-face .pip {
    width: 100%; aspect-ratio: 1; border-radius: 50%;
    background: #1a1030; align-self: center; justify-self: center;
    opacity: 0;
  }
  /* 3x3の升目のうち、どこに点を置くかを面ごとに指定 */
  .dice-face[data-n="1"] .p5 { opacity: 1; }
  .dice-face[data-n="2"] .p1, .dice-face[data-n="2"] .p9 { opacity: 1; }
  .dice-face[data-n="3"] .p1, .dice-face[data-n="3"] .p5, .dice-face[data-n="3"] .p9 { opacity: 1; }
  .dice-face[data-n="4"] .p1, .dice-face[data-n="4"] .p3, .dice-face[data-n="4"] .p7, .dice-face[data-n="4"] .p9 { opacity: 1; }

  .result-label { font-size: clamp(16px, 2vw, 22px); font-weight: 800; opacity: .95; }

  .left-spacer { flex: 1; }

  .left-bottom { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; height: 70px; }
  .left-bottom .block { font-weight: 800; font-size: 19px; line-height: 1.3; }
  .left-bottom label input { display: none; }

  /* ---- 右：バランス表（6行） / 開始終了・観客 ---- */
  .right-col { display: grid; grid-template-rows: 1fr auto; gap: 10px; min-height: 0; }

  .rows-table { display: grid; grid-template-rows: repeat(6, 1fr); gap: 8px; min-height: 0; }
  .balance-row {
    display: grid; grid-template-columns: 0.7fr 0.9fr 3fr 1.2fr 1.2fr;
    gap: 8px; min-height: 0;
    transition: filter .15s ease, opacity .15s ease;
  }

  .turn-btn { font-size: clamp(18px, 2vw, 24px); }
  .turn-btn.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255, 213, 74, .35); }

  .oc-cell { font-size: clamp(20px, 2.4vw, 30px); font-weight: 900; }
  .oc-cell.hit { color: var(--accent); }

  .name-cell { font-size: clamp(18px, 2.2vw, 30px); font-weight: 800; padding: 4px 10px; overflow: hidden; }
  .name-cell input {
    font: inherit; font-weight: 800; text-align: center;
    color: #fff; background: transparent; border: none;
    width: 100%;
  }

  .prob-cell, .remain-cell { flex-direction: column; gap: 2px; font-size: clamp(18px, 2vw, 26px); font-weight: 800; }
  .prob-cell .sub, .remain-cell .sub { font-size: 11px; font-weight: 600; opacity: .75; }

  .action-row {
    display: grid; grid-template-columns: 1fr 1fr auto 1fr 1.6fr;
    align-items: stretch; gap: 10px; height: 76px;
  }
  .action-row .block { font-weight: 800; font-size: 22px; }
  .action-row .plus { background: none; border: none; box-shadow: none; font-size: 30px; font-weight: 900; }
  .audience-label { font-size: 20px; }
  .audience-result { font-size: clamp(16px, 1.7vw, 22px); }

  /* ---- 設定パネル ---- */
  .settings-panel {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(10, 12, 30, 0.6);
    display: flex; align-items: center; justify-content: center;
  }
  .settings-panel[hidden] { display: none; }
  .settings-box {
    width: min(460px, 90vw);
    display: grid; gap: 14px; padding: 24px;
    background: linear-gradient(160deg, var(--settings-a), var(--settings-b));
    border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  }
  .settings-box { max-height: 84vh; overflow-y: auto; }
  .settings-box h2 { margin: 0; font-size: 21px; }
  .settings-box h3 {
    margin: 4px 0 -4px; font-size: 16px; letter-spacing: .08em;
    color: var(--accent); border-top: 1px solid var(--line); padding-top: 14px;
  }
  .settings-box label { display: grid; gap: 6px; font-size: 16px; color: var(--muted); }
  .settings-box input, .settings-box textarea {
    font: inherit; color: var(--fg); background: rgba(0,0,0,.3);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    resize: vertical;
  }
  .settings-box .row { display: flex; gap: 10px; justify-content: flex-end; }
  .settings-box .hint { font-size: 14px; opacity: .8; }

  .weight-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .weight-grid label { display: grid; justify-items: center; gap: 4px; font-size: 14px; }
  .weight-grid input { width: 100%; text-align: center; padding: 6px; }

  .weight-list { display: grid; gap: 6px; max-height: 160px; overflow-y: auto; }
  .weight-list .weight-row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .weight-list .weight-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .weight-list .weight-row input { width: 64px; text-align: center; padding: 4px 6px; flex: none; }

  .balance-settings-row { display: grid; grid-template-columns: 2fr 1fr; gap: 6px; font-size: 13px; align-items: center; }
  .balance-settings-row input { padding: 4px 6px; text-align: center; }
  .balance-settings-head { display: grid; grid-template-columns: 2fr 1fr; gap: 6px; font-size: 12px; opacity: .7; }
</style>
</head>

<script>
const { $, $$, mountTopbar, onKey, clamp, randInt, pick, xlsxSync } = QOL;
const { rouletteItems, sugorokuCells, players: defaultBoardPlayers } = QOL.data;
const { readSheet } = QOL.xlsxLite;

mountTopbar('バランスルーレット');

// ---- タイマー（-1/+1は1分単位） ----
// 画面はiframeの切り替えで毎回作り直されるため、終了時刻をlocalStorageに保存し、
// 他画面から戻ってきたときに現在時刻から残り秒数を計算し直して復元する。
const TIMER_KEY = 'qol_roulette_balance_timer';
let remain = 120 * 60;
// リングの満タン(100%)基準。60分固定だと、それより長いスタート時間を設定した際に
// リングの目盛りと実際の残り時間がズレるため、「スタート時点の残り時間」を都度、満タン基準にする。
let ringMax = remain;
let timerId = null;
const timerDisplay = $('#timerDisplay');
const timerRing = $('#timerRing');

function saveTimerState() {
  const state = timerId
    ? { running: true, endAt: Date.now() + remain * 1000, ringMax }
    : { running: false, remain, ringMax };
  localStorage.setItem(TIMER_KEY, JSON.stringify(state));
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}
function renderTimer() {
  timerDisplay.textContent = formatTime(remain);
  timerRing.style.setProperty('--pct', `${clamp(remain / ringMax, 0, 1) * 100}%`);
  timerRing.classList.toggle('warn', remain <= 30 && remain > 10);
  timerRing.classList.toggle('danger', remain <= 10);
}
function startTimer() {
  if (timerId) return;
  ringMax = Math.max(remain, 1);
  timerId = setInterval(() => {
    remain = Math.max(0, remain - 1);
    renderTimer();
    if (remain === 0) stopTimer();
  }, 1000);
  renderTimer();
  saveTimerState();
}
function stopTimer() {
  clearInterval(timerId);
  timerId = null;
  saveTimerState();
}

(() => {
  try {
    const saved = JSON.parse(localStorage.getItem(TIMER_KEY) || 'null');
    if (!saved) return;
    if (typeof saved.ringMax === 'number' && saved.ringMax > 0) ringMax = saved.ringMax;
    if (saved.running && typeof saved.endAt === 'number') {
      remain = Math.max(0, Math.round((saved.endAt - Date.now()) / 1000));
      ringMax = Math.max(ringMax, remain);
      if (remain > 0) startTimer();
      else saveTimerState();
    } else if (typeof saved.remain === 'number') {
      remain = clamp(saved.remain, 0, 5999 * 60);
      ringMax = Math.max(ringMax, remain);
    }
  } catch { /* 保存データが壊れていれば初期値のまま */ }
})();

$('#minusBtn').addEventListener('click', () => {
  remain = clamp(remain - 60, 0, 5999 * 60);
  if (!timerId) ringMax = Math.max(remain, 1);
  renderTimer();
  saveTimerState();
});
$('#plusBtn').addEventListener('click', () => {
  remain = clamp(remain + 60, 0, 5999 * 60);
  if (!timerId) ringMax = Math.max(remain, 1);
  renderTimer();
  saveTimerState();
});
$('#startTimerBtn').addEventListener('click', startTimer);
$('#stopTimerBtn').addEventListener('click', stopTimer);

// ---- 重み付きランダム抽選（出る確率の反映） ----
function weightedPick(items, weightOf) {
  const weights = items.map((it) => Math.max(0, Number(weightOf(it)) || 0));
  const total = weights.reduce((a, b) => a + b, 0);
  if (total <= 0) return pick(items);
  let r = Math.random() * total;
  for (let i = 0; i < items.length; i++) {
    r -= weights[i];
    if (r <= 0) return items[i];
  }
  return items[items.length - 1];
}

// ---- 進むマス範囲・ジャンル一覧・速度/確率設定 ----
let rangeMin = 1, rangeMax = 4;
let genres = rouletteItems.map((it) => it.label);
let genreWeights = {};
let diceSpeed = 60;
let diceWeights = [1, 1, 1, 1];
let genreSpeed = 80;

// ---- バランス表（6行）：行ごとに「○が出る確率」で独立抽選する ----
// ○が出る確率は残りマス数から自動計算する（手入力はしない）。
// 6人の中で一番後ろ（残りマス数が一番多い）のプレイヤーがMAX90%。
// そこから1マス先（残りマス数が1少ない）にいるごとに3%ずつ下がる。
const ROW_COUNT = 6;
let balanceSpeed = 70; // ○/- のちらつき速度(ms)
let balanceRows = Array.from({ length: ROW_COUNT }, (_, i) => ({
  name: `プレイヤー${i + 1}`,
  remain: 6,  // 残りマス数
  result: '-',
}));
let currentTurn = null; // ▶ で選択した「現在のプレイヤー」の行インデックス（null=未選択）。選択中は必ず○が出る。

// 6行のうち一番後ろ（残りマス数が一番多い）のプレイヤーを基準の90%とし、
// そこから1マス先にいるごとに3%ずつ低くする
function calcProb(remain, lastRemain) {
  return clamp(90 - (lastRemain - remain) * 3, 0, 100);
}
// 表示・抽選ともに、▶で選択中の行は確率によらず必ず100%（○確定）にする
function probFor(i) {
  if (i === currentTurn) return 100;
  const lastRemain = Math.max(...balanceRows.map((r) => r.remain));
  return calcProb(balanceRows[i].remain, lastRemain);
}

// ---- banmen（すごろく盤面）画面と「残りマス数」を連動させる ----
// sugoroku.html がタブ内で共有しているsessionStorageの盤面状態を読み書きし、
// 名前が一致するプレイヤーの pos（現在マス目）から残りマス数を逆算する。
// 一致するプレイヤーがbanmen側にいない行は、これまで通りこの画面だけのローカル値を使う。
const BOARD_STORAGE_KEY = 'qol:sugoroku-state';
const BOARD_GOAL = sugorokuCells.length - 1;

function loadBoardRaw() {
  try {
    const raw = sessionStorage.getItem(BOARD_STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed.state)) return null;
    return parsed;
  } catch { return null; }
}
function saveBoardRaw(raw) {
  try { sessionStorage.setItem(BOARD_STORAGE_KEY, JSON.stringify(raw)); } catch { /* 保存できなくても致命的ではない */ }
}

// banmen画面がまだ一度も開かれていない（sessionStorageに何も無い）場合は、
// banmen側と同じ初期状態（既定の名簿・全員スタート位置）を代わりに作っておく。
// これにより、banmenタブを開く前でもバランス表と盤面の連動が最初から機能する。
function ensureBoardRaw() {
  const raw = loadBoardRaw();
  if (raw) return raw;
  const initRaw = { state: defaultBoardPlayers.map((p) => ({ ...p, pos: 0 })), active: 0, log: '' };
  saveBoardRaw(initRaw);
  return initRaw;
}

// banmen側の現在位置から、名前が一致する行の残りマス数を反映する
function syncRemainFromBoard() {
  const raw = ensureBoardRaw();
  if (!raw) return;
  let changed = false;
  balanceRows.forEach((row) => {
    const p = raw.state.find((x) => x.name === row.name);
    if (!p) return;
    const nextRemain = Math.max(0, BOARD_GOAL - p.pos);
    if (row.remain !== nextRemain) { row.remain = nextRemain; changed = true; }
  });
  if (changed) renderRows();
}

// 設定パネルで残りマス数を直接編集したときも、一致するプレイヤーがいればbanmen側の位置を書き換える
function applyRemainSetting(row, newRemain) {
  const raw = ensureBoardRaw();
  const p = raw.state.find((x) => x.name === row.name);
  if (p) {
    p.pos = clamp(BOARD_GOAL - newRemain, 0, BOARD_GOAL);
    saveBoardRaw(raw);
    row.remain = Math.max(0, BOARD_GOAL - p.pos);
  } else {
    row.remain = Math.max(0, newRemain);
  }
}

// banmen画面（別iframe）でコマが動かされたときも、この画面の残りマス数へ即時反映する
window.addEventListener('storage', (e) => {
  if (e.key === BOARD_STORAGE_KEY) syncRemainFromBoard();
});

const rowsTable = $('#rowsTable');
const rowEls = [];

function renderRows() {
  rowsTable.innerHTML = '';
  rowEls.length = 0;
  balanceRows.forEach((row, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'balance-row';

    const turnBtn = document.createElement('button');
    turnBtn.className = 'block click turn-btn';
    turnBtn.textContent = i === currentTurn ? '▶' : '';
    turnBtn.title = '現在のプレイヤーを明示';
    turnBtn.addEventListener('click', () => {
      currentTurn = currentTurn === i ? null : i;
      renderRows();
    });

    const ocCell = document.createElement('div');
    ocCell.className = 'block oc-cell' + (row.result === '○' ? ' hit' : '');
    ocCell.textContent = row.result;

    const nameCell = document.createElement('div');
    nameCell.className = 'block name-cell';
    nameCell.textContent = row.name;

    const probCell = document.createElement('div');
    probCell.className = 'block prob-cell';
    probCell.innerHTML = `<span>${probFor(i)}%</span><span class="sub">○が出る確率</span>`;

    const remainCell = document.createElement('div');
    remainCell.className = 'block remain-cell';
    remainCell.innerHTML = `<span>${row.remain}</span><span class="sub">残りマス数</span>`;

    wrap.append(turnBtn, ocCell, nameCell, probCell, remainCell);
    rowsTable.appendChild(wrap);
    rowEls.push({ wrap, turnBtn, ocCell, nameCell, probCell, remainCell });
  });
  updateTurnHighlight();
}

function updateTurnHighlight() {
  rowEls.forEach((els, i) => {
    els.turnBtn.classList.toggle('active', currentTurn === i);
    els.wrap.classList.toggle('dim', currentTurn !== null && currentTurn !== i);
  });
}

function renderRowResult(i) {
  const row = balanceRows[i];
  const els = rowEls[i];
  els.ocCell.textContent = row.result;
  els.ocCell.classList.toggle('hit', row.result === '○');
  els.remainCell.innerHTML = `<span>${row.remain}</span><span class="sub">残りマス数</span>`;
}

renderRows();
syncRemainFromBoard();

// ---- ジャンルの「出る確率」編集UI（一覧ごとに数値入力を並べる） ----
function renderGenreWeightsUI() {
  const box = $('#genreWeightsBox');
  box.innerHTML = '';
  genres.forEach((name) => {
    const row = document.createElement('div');
    row.className = 'weight-row';

    const label = document.createElement('span');
    label.textContent = name;

    const input = document.createElement('input');
    input.type = 'number';
    input.min = '0';
    input.step = '0.1';
    input.value = String(genreWeights[name] ?? 1);
    input.dataset.name = name;

    row.append(label, input);
    box.appendChild(row);
  });
}

// ---- バランス行（名前/残りマス数）編集UI ----
// ○が出る確率は残りマス数から自動計算されるため、ここでは編集できない（本体の表で確認する）。
function renderBalanceRowsUI() {
  const box = $('#balanceRowsBox');
  box.innerHTML = '';
  balanceRows.forEach((row, i) => {
    const line = document.createElement('div');
    line.className = 'balance-settings-row';

    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.value = row.name;
    nameInput.dataset.field = 'name';
    nameInput.dataset.index = String(i);

    const remainInput = document.createElement('input');
    remainInput.type = 'number';
    remainInput.min = '0';
    remainInput.value = String(row.remain);
    remainInput.dataset.field = 'remain';
    remainInput.dataset.index = String(i);

    line.append(nameInput, remainInput);
    box.appendChild(line);
  });
}

// ---- ルーレット本体（進むマス数 & ジャンル & バランス表の○/-） ----
const genreBox = $('#genreBox');
const resultPlaceholder = $('#resultPlaceholder');
const diceScene = $('#diceScene');
const diceCube = $('#diceCube');
const resultLabel = $('#resultLabel');
const audienceResult = $('#audienceResult');

let genreSpinId = null;
let diceRAF = null;
let spinTextId = null;
let balanceSpinId = null;
let cubeAngle = 0;

const useDice = () => rangeMax - rangeMin + 1 === 4;

function pickDiceFace() {
  return weightedPick([1, 2, 3, 4], (n) => diceWeights[n - 1]);
}

function spinDiceFrame() {
  cubeAngle += 840 / diceSpeed;
  diceCube.style.transform = `rotateY(${cubeAngle}deg)`;
  diceRAF = requestAnimationFrame(spinDiceFrame);
}

function startRoulette() {
  if (genreSpinId || diceRAF || balanceSpinId) return;
  $('#rlStart').disabled = true;
  $('#rlStop').disabled = false;

  genreSpinId = setInterval(() => {
    genreBox.textContent = weightedPick(genres, (g) => genreWeights[g] ?? 1) ?? 'ジャンル';
  }, genreSpeed);

  // バランス表：全6行の○/-を同時にちらつかせる（確定は終了時に各行の確率で個別抽選）
  balanceSpinId = setInterval(() => {
    balanceRows.forEach((row, i) => {
      row.result = Math.random() < 0.5 ? '○' : '-';
      rowEls[i].ocCell.textContent = row.result;
      rowEls[i].ocCell.classList.remove('hit');
    });
  }, balanceSpeed);

  audienceResult.textContent = '抽選中…';

  if (useDice()) {
    resultPlaceholder.hidden = true;
    resultLabel.hidden = true;
    diceScene.hidden = false;
    diceCube.style.transition = 'none';
    spinDiceFrame();
  } else {
    resultPlaceholder.hidden = false;
    diceScene.hidden = true;
    resultLabel.hidden = false;
    spinTextId = setInterval(() => {
      resultPlaceholder.textContent = String(rangeMin + randInt(rangeMax - rangeMin + 1));
    }, diceSpeed);
  }
}

function stopRoulette() {
  if (!genreSpinId && !diceRAF && !spinTextId && !balanceSpinId) return;
  clearInterval(genreSpinId);
  genreSpinId = null;
  $('#rlStart').disabled = false;
  $('#rlStop').disabled = true;

  // 進むマス数を確定させる（バランス表の○確定行は、このマス数ぶん残りマス数を減らす）
  let squares = 1;
  if (diceRAF) {
    cancelAnimationFrame(diceRAF);
    diceRAF = null;
    const final = pickDiceFace(); // 1〜4（出る確率を反映）
    squares = final;
    const desiredMod = ((360 - (final - 1) * 90) % 360 + 360) % 360;
    const currentMod = ((cubeAngle % 360) + 360) % 360;
    const diff = (desiredMod - currentMod + 360) % 360;
    cubeAngle += diff + 720;
    diceCube.style.transition = 'transform 1.1s cubic-bezier(.15,.8,.25,1)';
    diceCube.style.transform = `rotateY(${cubeAngle}deg)`;
    resultLabel.hidden = false;
    resultLabel.textContent = `${final}マス`;
  }
  if (spinTextId) {
    clearInterval(spinTextId);
    spinTextId = null;
    squares = rangeMin + randInt(rangeMax - rangeMin + 1);
    resultPlaceholder.textContent = String(squares);
  }

  // バランス表：行ごとに「○が出る確率」で独立抽選する（○/-の結果表示のみ。
  // banmen側の駒はここでは動かさない。実際に進めるかどうかはbanmen画面で手動操作する）
  if (balanceSpinId) {
    clearInterval(balanceSpinId);
    balanceSpinId = null;
    balanceRows.forEach((row, i) => {
      row.result = Math.random() * 100 < probFor(i) ? '○' : '-';
      renderRowResult(i);
    });
  }

  // 観客：0〜3人がランダムに選ばれる
  const audienceCount = randInt(4);
  audienceResult.textContent = `観客${audienceCount}人`;
}
$('#rlStart').addEventListener('click', startRoulette);
$('#rlStop').addEventListener('click', stopRoulette);

// ---- 設定パネル ----
const settingsPanel = $('#settingsPanel');

$('#settingsBtn').addEventListener('click', () => {
  $('#minRange').value = rangeMin;
  $('#maxRange').value = rangeMax;
  $('#diceSpeed').value = diceSpeed;
  $$('#diceWeights input').forEach((inp) => { inp.value = diceWeights[Number(inp.dataset.face) - 1]; });

  $('#genreSpeed').value = genreSpeed;
  renderGenreWeightsUI();

  $('#balanceSpeed').value = balanceSpeed;
  renderBalanceRowsUI();

  settingsPanel.hidden = false;
});
$('#settingsCancel').addEventListener('click', () => { settingsPanel.hidden = true; });
$('#settingsApply').addEventListener('click', () => {
  rangeMin = clamp(Number($('#minRange').value) || 1, 1, 99);
  rangeMax = clamp(Number($('#maxRange').value) || 4, rangeMin, 99);
  diceSpeed = clamp(Number($('#diceSpeed').value) || 60, 20, 500);
  $$('#diceWeights input').forEach((inp) => {
    diceWeights[Number(inp.dataset.face) - 1] = Math.max(0, Number(inp.value) || 0);
  });

  genreSpeed = clamp(Number($('#genreSpeed').value) || 80, 20, 500);
  const newGenreWeights = {};
  $$('#genreWeightsBox input').forEach((inp) => {
    newGenreWeights[inp.dataset.name] = Math.max(0, Number(inp.value) || 0);
  });
  genreWeights = newGenreWeights;

  balanceSpeed = clamp(Number($('#balanceSpeed').value) || 70, 20, 500);
  $$('#balanceRowsBox input').forEach((inp) => {
    const row = balanceRows[Number(inp.dataset.index)];
    if (!row) return;
    if (inp.dataset.field === 'name') row.name = inp.value.trim() || row.name;
    if (inp.dataset.field === 'remain') applyRemainSetting(row, Math.max(0, Number(inp.value) || 0));
  });
  renderRows();
  syncRemainFromBoard();

  settingsPanel.hidden = true;
});

// ---- Excel読み込み（「メンバールーレット」シートのC列:ジャンル／D列:出現確率を使う。全画面で1つのExcelを共有する） ----
async function applyWorkbook(file) {
  const rows = await readSheet(file, /メンバールーレット/);
  const dataRows = rows.slice(1); // 1行目（見出し）は除外

  const loadedGenres = [];
  const newGenreWeights = {};

  dataRows.forEach((r) => {
    const genre = (r[2] ?? '').trim();
    if (genre) {
      loadedGenres.push(genre);
      const w = Number(r[3]);
      newGenreWeights[genre] = Number.isFinite(w) && w >= 0 ? w : 1;
    }
  });

  // A2〜A7（dataRowsの先頭6件）を、プレイヤー1〜6の名前としてそのまま割り当てる
  let namedCount = 0;
  for (let i = 0; i < ROW_COUNT; i++) {
    const name = (dataRows[i]?.[0] ?? '').trim();
    if (name) {
      balanceRows[i].name = name;
      namedCount++;
    }
  }
  if (namedCount) { renderRows(); syncRemainFromBoard(); }

  if (!loadedGenres.length && !namedCount) {
    throw new Error('A列にプレイヤー名、C列にジャンル名が見つかりませんでした');
  }

  genres = loadedGenres.length ? loadedGenres : genres;
  if (loadedGenres.length) genreWeights = newGenreWeights;

  const parts = [];
  if (namedCount) parts.push(`プレイヤー${namedCount}人`);
  if (loadedGenres.length) parts.push(`ジャンル${loadedGenres.length}件`);
  return parts.join(' / ');
}

$('#fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    await xlsxSync.saveWorkbook(file);
  } catch (err) {
    alert(err.message);
    return;
  }
  try {
    const summary = await applyWorkbook(file);
    alert(`${summary} を読み込みました`);
  } catch (err) {
    alert(`読み込みに失敗しました：${err.message}`);
  }
});

// ---- 読み込みデータのクリア（Excelを解除し、ジャンルを初期状態に戻す） ----
$('#clearWorkbookBtn').addEventListener('click', () => {
  if (!confirm('読み込んだExcelを解除して、ジャンルを初期状態に戻します。よろしいですか？')) return;
  xlsxSync.clearWorkbook();
  genres = rouletteItems.map((it) => it.label);
  genreWeights = {};
  renderGenreWeightsUI();
  alert('読み込みデータをクリアしました');
});

// ---- すべて初期値に戻す（タイマー・読み込みデータ・進むマス/ジャンル/バランス表の設定を一括リセット） ----
$('#resetAllBtn').addEventListener('click', () => {
  if (!confirm('タイマー・読み込みファイル・各種設定など、この画面のすべてを初期値に戻します。よろしいですか？')) return;

  stopTimer();
  remain = 120 * 60;
  ringMax = remain;
  renderTimer();
  saveTimerState();

  rangeMin = 1;
  rangeMax = 4;
  diceSpeed = 60;
  diceWeights = [1, 1, 1, 1];

  genreSpeed = 80;

  xlsxSync.clearWorkbook();
  genres = rouletteItems.map((it) => it.label);
  genreWeights = {};

  balanceSpeed = 70;
  balanceRows = Array.from({ length: ROW_COUNT }, (_, i) => ({
    name: `プレイヤー${i + 1}`,
    remain: 6,
    result: '-',
  }));
  currentTurn = null;
  renderRows();
  syncRemainFromBoard();
  audienceResult.textContent = '0〜3人がランダムで出る';

  $('#minRange').value = rangeMin;
  $('#maxRange').value = rangeMax;
  $('#diceSpeed').value = diceSpeed;
  $$('#diceWeights input').forEach((inp) => { inp.value = diceWeights[Number(inp.dataset.face) - 1]; });
  $('#genreSpeed').value = genreSpeed;
  renderGenreWeightsUI();
  $('#balanceSpeed').value = balanceSpeed;
  renderBalanceRowsUI();

  alert('すべて初期値に戻しました');
});

// 他の画面で読み込み済みのExcelがあれば、起動時に自動で取り込む
async function syncWorkbookFromStorage() {
  try {
    const file = await xlsxSync.loadWorkbook();
    if (!file) return;
    await applyWorkbook(file);
  } catch (err) { console.warn('[バランスルーレット]', err.message); }
}

syncWorkbookFromStorage();

// 他の画面でExcelが読み込まれたら、この画面も自動的に反映する
xlsxSync.onWorkbookChange(syncWorkbookFromStorage);

onKey({ ' ': () => (genreSpinId || diceRAF || spinTextId || balanceSpinId ? stopRoulette() : startRoulette()) });

renderTimer();
</script>
