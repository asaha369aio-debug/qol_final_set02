<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>すごろく盤面</title>
<link rel="stylesheet" href="../css/common.css">
<style>
  body { overflow: hidden; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }

  /* ---- 盤面：用意された画像をそのまま背景にして駒だけ重ねる ---- */
  .board {
    position: relative;
    flex: 1; min-height: 0;
    margin: 10px 14px 6px;
    display: flex; align-items: center; justify-content: center;
  }
  .board-inner {
    position: relative;
    box-shadow: var(--shadow);
  }
  .board-inner img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    border-radius: 12px;
  }

  .marker {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex; flex-wrap: nowrap;
    align-items: center; justify-content: center;
    padding: 4px;
    border-radius: 999px;
    z-index: 2;
  }
  /* 同じマスの2枚目以降は少し重ねて、別マスに見えないようにする */
  .marker .piece + .piece { margin-left: -12px; }
  .marker.here {
    animation: ring 1.4s ease infinite;
    background: rgba(255, 213, 74, 0.18);
  }
  @keyframes ring {
    0%, 100% { box-shadow: 0 0 0 3px var(--accent); }
    50%      { box-shadow: 0 0 0 8px rgba(255, 213, 74, .35); }
  }

  .piece {
    width: clamp(20px, 3.4vh, 32px); height: clamp(20px, 3.4vh, 32px);
    border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.95);
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5);
    transition: transform .15s ease;
    display: grid; place-items: center;
    color: #fff; font-weight: 900; font-size: clamp(10px, 1.7vh, 15px);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
  }
  .piece.hop { animation: hop .18s ease; }
  @keyframes hop { 50% { transform: translateY(-9px) scale(1.25); } }

  /* ---- 操作バー ---- */
  .ctrl {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 8px 16px 12px;
  }

  .step-btn {
    font-size: 20px; font-weight: 900; width: 42px; height: 42px;
    padding: 0; border-radius: 10px;
  }

  /* リセットは誤操作しやすいので他の操作ボタンより明確に小さく・離して配置する */
  #resetBtn {
    padding: 4px 10px;
    font-size: 11px;
    margin-left: 8px;
  }

  .player-count {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 700; color: var(--muted);
  }
  .player-count select {
    font: inherit; font-weight: 700; color: var(--fg);
    background: rgba(0,0,0,.3); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px;
  }

  .pchip {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel);
    font-size: 13px; font-weight: 700;
  }
  .pchip.turn { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,213,74,.3); }
  .pchip .dot {
    width: 14px; height: 14px; border-radius: 50%; flex: none;
    cursor: pointer; border: 2px solid transparent;
  }
  .pchip .dot:hover { border-color: rgba(255,255,255,.6); }
  .pchip .name {
    font: inherit; font-weight: 700; color: var(--fg);
    background: transparent; border: none; outline: none;
    width: 6em; min-width: 0;
  }
  .pchip .name:focus { text-decoration: underline; text-decoration-color: var(--accent); }
  .pchip .pos { color: var(--muted); font-size: 11px; flex: none; }
  .log { color: var(--accent); font-weight: 700; font-size: 14px; margin-left: auto; }
</style>
</head>
<body>
<main>
  <div class="board" id="board">
    <div class="board-inner" id="boardInner">
      <img id="boardImg" alt="すごろく盤面">
      <div id="markers"></div>
    </div>
  </div>

  <div class="ctrl">
    <button class="btn step-btn" id="backBtn">◀</button>
    <button class="btn step-btn" id="fwdBtn">▶</button>
    <button class="btn sm ghost" id="resetBtn">リセット</button>
    <label class="player-count">
      人数
      <select id="playerCount"></select>
    </label>
    <span id="pchips" style="display:flex;gap:8px;flex-wrap:wrap"></span>
    <span class="log" id="log"></span>
  </div>
</main>

<script src="../js/common.js"></script>
<script src="../js/data.js"></script>
<script src="../js/xlsx-lite.js"></script>
<script src="../js/xlsx-sync.js"></script>
<script>
const { $, mountTopbar, onKey, clamp, xlsxSync } = QOL;
const { readSheet } = QOL.xlsxLite;
const { sugorokuCells: cells, sugorokuBoard: board, players: defaultPlayers } = QOL.data;

// プレイヤーの色は名簿の人数ぶん巡回して割り当てる
const PLAYER_COLORS = ['#ff5c8a', '#4aa8ff', '#3ddc97', '#ffd54a', '#b07cff', '#ff8a3d', '#4ae0d0', '#f06292'];
function namesToPlayers(names) {
  return names.map((name, i) => ({ name, color: PLAYER_COLORS[i % PLAYER_COLORS.length] }));
}

let players = defaultPlayers;

mountTopbar('banmen');

// ---- 盤面の状態を保持（画面切り替えでiframeが再読み込みされても消えないようにする） ----
// タブを閉じるまで保持したいのでsessionStorageを使う
const STORAGE_KEY = 'qol:sugoroku-state';
function saveState() {
  try {
    sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
      state, active, log: logEl.textContent,
    }));
  } catch (err) { /* 保存できなくても致命的ではないので無視 */ }
}
function loadSavedState() {
  try {
    const raw = sessionStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const saved = JSON.parse(raw);
    if (!Array.isArray(saved.state) || !saved.state.length) return null;
    return saved;
  } catch (err) { return null; }
}

const GOAL = cells.length - 1;
const boardEl = $('#board');
const boardInner = $('#boardInner');
const boardImg = $('#boardImg');
const markersEl = $('#markers');
const logEl = $('#log'), pchipsEl = $('#pchips');

// ---- 画像内の座標（px）→ %。用意された盤面画像の上にそのまま駒を重ねる ----
const positionsPx = new Array(cells.length);
positionsPx[0] = board.start;
positionsPx[GOAL] = board.goal;

let cursor = 1;
board.rows.forEach((row) => {
  const step = row.count > 1 ? (row.xEnd - row.xStart) / (row.count - 1) : 0;
  for (let k = 0; k < row.count; k++) {
    positionsPx[cursor] = { x: row.xStart + k * step, y: row.y };
    cursor++;
  }
});

const positions = positionsPx.map((p) => ({
  x: (p.x / board.width) * 100,
  y: (p.y / board.height) * 100,
}));

// 盤面画像のアスペクト比を保ったまま、利用可能な領域いっぱいに表示する
function fitBoard() {
  const w = boardEl.clientWidth, h = boardEl.clientHeight;
  if (!w || !h) return;
  const ratio = board.width / board.height;
  let fw = w, fh = w / ratio;
  if (fh > h) { fh = h; fw = h * ratio; }
  boardInner.style.width = `${Math.floor(fw)}px`;
  boardInner.style.height = `${Math.floor(fh)}px`;
}

// ---- 人数設定 ----
const playerCountSelect = $('#playerCount');
function rebuildPlayerCountOptions() {
  const prev = Number(playerCountSelect.value) || players.length;
  playerCountSelect.innerHTML = '';
  players.forEach((_, i) => {
    const opt = document.createElement('option');
    opt.value = i + 1;
    opt.textContent = `${i + 1}人`;
    playerCountSelect.appendChild(opt);
  });
  playerCountSelect.value = Math.min(prev, players.length) || players.length;
}
rebuildPlayerCountOptions();

function buildState(count) {
  return players.slice(0, count).map((p) => ({ ...p, pos: 0 }));
}

let state = buildState(players.length);
let active = 0; // 今どのプレイヤーのコマを動かすか

// 画面切り替え直後（iframe再読み込み直後）は、保存されていた盤面状態を復元する
const savedOnLoad = loadSavedState();
if (savedOnLoad) {
  state = savedOnLoad.state;
  active = clamp(savedOnLoad.active ?? 0, 0, state.length - 1);
  playerCountSelect.value = Math.min(state.length, players.length) || players.length;
  logEl.textContent = savedOnLoad.log || '';
}

// 名簿（Excel）が更新されたら、人数選択肢と現在の状態を作り直す。
// 名前が既存の駒と一致する場合は位置を引き継ぎ、切り替え時の再読み込みで
// マスの位置がリセットされないようにする。
// 名簿の中身が前回と変わっていない場合（単なる画面切り替えの再読み込み）は
// 人数の選択も維持するが、Excelの名簿自体が変わった場合は新しい名簿を
// 全員分反映する（そうしないと、以前の人数のまま切り詰められてしまう）。
function applyPlayers(names) {
  const prevByName = new Map(state.map((p) => [p.name, p]));
  const prevNames = state.map((p) => p.name).sort().join('|');
  players = names.length ? namesToPlayers(names) : defaultPlayers;
  const newNames = players.map((p) => p.name).sort().join('|');
  const rosterChanged = prevNames !== newNames;
  rebuildPlayerCountOptions();
  if (rosterChanged) playerCountSelect.value = players.length;
  const count = Number(playerCountSelect.value);
  const prevActiveName = state[active]?.name;
  state = players.slice(0, count).map((p) => ({ ...p, pos: prevByName.get(p.name)?.pos ?? 0 }));
  active = Math.max(0, state.findIndex((p) => p.name === prevActiveName));
  renderPieces();
  renderChips();
  saveState();
}

// ---- Excel読み込み（「メンバールーレット」シートのA列を使う。ルーレット画面と共有） ----
// 「全員」「それ以外」は特別枠のためプレイヤー名簿には含めない
async function loadNamesFromWorkbook(file) {
  const rows = await readSheet(file, /メンバールーレット/);
  const dataRows = rows.slice(1);
  return dataRows
    .map((r) => (r[0] ?? '').trim())
    .filter(Boolean)
    .filter((n) => n !== '全員' && n !== 'それ以外');
}

async function syncPlayersFromWorkbook() {
  try {
    const file = await xlsxSync.loadWorkbook();
    if (!file) return;
    const names = await loadNamesFromWorkbook(file);
    if (names.length) applyPlayers(names);
  } catch (err) { console.warn('[すごろく]', err.message); }
}

syncPlayersFromWorkbook();
xlsxSync.onWorkbookChange(syncPlayersFromWorkbook);

playerCountSelect.addEventListener('change', () => {
  const prevByName = new Map(state.map((p) => [p.name, p]));
  const count = Number(playerCountSelect.value);
  state = players.slice(0, count).map((p) => ({ ...p, pos: prevByName.get(p.name)?.pos ?? 0 }));
  active = 0;
  logEl.textContent = '';
  renderPieces();
  renderChips();
  saveState();
});

// ---- 描画 ----
function renderPieces(hopPos = -1) {
  markersEl.innerHTML = '';
  const byCell = new Map();
  state.forEach((p, i) => {
    if (!byCell.has(p.pos)) byCell.set(p.pos, []);
    byCell.get(p.pos).push(i);
  });

  byCell.forEach((idxs, pos) => {
    const marker = document.createElement('div');
    marker.className = 'marker' + (idxs.includes(active) ? ' here' : '');
    marker.style.left = `${positions[pos].x}%`;
    marker.style.top = `${positions[pos].y}%`;
    idxs.forEach((i) => {
      const dot = document.createElement('span');
      dot.className = 'piece' + (i === active && pos === hopPos ? ' hop' : '');
      dot.style.background = state[i].color;
      dot.title = state[i].name;
      dot.textContent = [...state[i].name.trim()][0] || '';
      marker.appendChild(dot);
    });
    markersEl.appendChild(marker);
  });
}

function renderChips() {
  pchipsEl.innerHTML = '';
  state.forEach((p, i) => {
    const chip = document.createElement('span');
    chip.className = 'pchip' + (i === active ? ' turn' : '');

    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = p.color;
    dot.title = 'クリックで操作対象を切り替え';
    dot.addEventListener('click', () => {
      active = i;
      renderPieces();
      renderChips();
      saveState();
    });

    // 名前は直接編集可能。入力のたびに全体を再描画するとフォーカスが切れるため
    // ここではstateの更新だけ行い、DOMの再構築（renderChips）は呼ばない。
    const nameInput = document.createElement('input');
    nameInput.className = 'name';
    nameInput.type = 'text';
    nameInput.value = p.name;
    nameInput.maxLength = 10;
    nameInput.addEventListener('input', () => { p.name = nameInput.value; saveState(); });

    const posSpan = document.createElement('span');
    posSpan.className = 'pos';
    posSpan.textContent = p.pos === 0 ? 'START' : p.pos === GOAL ? 'GOAL' : `${p.pos}マス`;

    chip.append(dot, nameInput, posSpan);
    pchipsEl.appendChild(chip);
  });
}

// ---- 選択中プレイヤーのコマを1マス前後に動かす ----
function step(dir) {
  const p = state[active];
  const next = clamp(p.pos + dir, 0, GOAL);
  if (next === p.pos) return;
  p.pos = next;
  renderPieces(p.pos);
  logEl.textContent = p.pos === GOAL
    ? `${p.name} がゴール！🎉`
    : `${p.name}：${cells[p.pos].no}マス目`;
  renderChips();
  saveState();
}

$('#fwdBtn').addEventListener('click', () => step(1));
$('#backBtn').addEventListener('click', () => step(-1));
$('#resetBtn').addEventListener('click', () => {
  if (!confirm('全プレイヤーの位置をスタートに戻します。よろしいですか？')) return;
  state.forEach((p) => (p.pos = 0));
  logEl.textContent = '';
  renderPieces();
  renderChips();
  saveState();
});
onKey({ ArrowRight: () => step(1), ArrowLeft: () => step(-1) });
window.addEventListener('resize', fitBoard);

// バランスルーレット画面など、別iframeから盤面状態（sessionStorage）が更新されたときに即時反映する
window.addEventListener('storage', (e) => {
  if (e.key !== STORAGE_KEY) return;
  const saved = loadSavedState();
  if (!saved) return;
  state = saved.state;
  active = clamp(saved.active ?? active, 0, state.length - 1);
  logEl.textContent = saved.log || '';
  renderPieces();
  renderChips();
});

boardImg.addEventListener('load', fitBoard);
boardImg.src = `../${board.image}`;
fitBoard();
renderPieces();
renderChips();
</script>
</body>
</html>
