<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QOLFINAL</title>
<link rel="stylesheet" href="css/common.css">
<style>
  body { display: block; height: 100vh; overflow: hidden; }

  .app {
    height: 100vh;
    display: grid;
    grid-template-columns: 1fr 22fr;
    gap: 16px;
    padding: 14px;
  }

  /* 左：メニュー列 */
  .sidebar {
    display: grid;
    grid-template-rows: repeat(8, 1fr);
    gap: 12px;
    min-height: 0;
    overflow-y: auto;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    font: inherit;
    color: var(--fg);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 4px;
    cursor: pointer;
    overflow: hidden;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .nav-item:hover { border-color: var(--accent); transform: translateY(-2px); }
  /* 幅が細いので、絵文字と文字サイズはカラム幅に追従させる */
  .nav-item .emoji { font-size: clamp(13px, 1.3vw, 18px); line-height: 1; }
  .nav-item .label { font-size: clamp(8px, 0.7vw, 10px); font-weight: 700; line-height: 1.3; }
  .nav-item.active {
    background: rgba(255, 213, 74, .14);
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(255, 213, 74, .25);
  }

  /* 右：選択された画面 */
  .viewport {
    min-height: 0;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: rgba(0, 0, 0, .22);
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .viewport iframe {
    flex: 1;
    width: 100%;
    border: 0;
    background: transparent;
    display: none;
  }
  .viewport iframe.active { display: block; }

  @media (max-width: 720px) {
    body { overflow: auto; }
    .app { height: auto; grid-template-columns: 1fr; }
    .sidebar { grid-template-rows: none; grid-template-columns: repeat(3, 1fr); }
    .viewport { height: 78vh; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>

  <section class="viewport" id="viewport"></section>
</div>

<script src="js/common.js"></script>
<script>
const { $ } = QOL;

const screens = [
  { id: 'roulette',    emoji: '🎯', label: 'roulette',     file: 'screens/roulette.html' },
  { id: 'roulette-balance', emoji: '⚖️', label: 'バランスルーレット', file: 'screens/roulette-balance.html' },
  { id: 'quiz-visual', emoji: '🖼️', label: 'visual',       file: 'screens/quiz-visual.html' },
  { id: 'card-text',   emoji: '🃏', label: 'textcard',     file: 'screens/card-text.html' },
  { id: 'ogiri',       emoji: '😂', label: 'oogiri',       file: 'screens/ogiri.html' },
  { id: 'ogiri-count', emoji: '🔟', label: 'oogiri_count', file: 'screens/ogiri-count.html' },
  { id: 'sugoroku',    emoji: '🎲', label: 'banmen',       file: 'screens/sugoroku.html' },
  { id: 'suggest',     emoji: '🔍', label: 'kensaku',      file: 'screens/suggest.html' },
];

const sidebar = $('#sidebar');
const viewport = $('#viewport');

// 画面を切り替えてもリセットされないよう、各画面のiframeは初回表示時に1度だけ読み込み、
// 以降はdisplayの切り替えのみで使い回す（src を再設定して作り直すとJSの状態が消えてしまうため）
const frames = {};
screens.forEach((s) => {
  const btn = document.createElement('button');
  btn.className = 'nav-item';
  btn.dataset.id = s.id;
  btn.innerHTML = `<span class="emoji">${s.emoji}</span><span class="label">${s.label}</span>`;
  btn.addEventListener('click', () => select(s.id));
  sidebar.appendChild(btn);

  const iframe = document.createElement('iframe');
  iframe.title = s.label;
  viewport.appendChild(iframe);
  frames[s.id] = iframe;
});

function select(id, { push = true } = {}) {
  const s = screens.find((x) => x.id === id) ?? screens[0];
  const iframe = frames[s.id];
  if (!iframe.src) iframe.src = s.file;
  Object.values(frames).forEach((f) => f.classList.toggle('active', f === iframe));
  document.title = `${s.label} - QOLFINAL`;
  [...sidebar.children].forEach((b) => b.classList.toggle('active', b.dataset.id === s.id));
  if (push) history.replaceState(null, '', `#${s.id}`);
}

// ハッシュで直接その画面を開けるようにする（例: index.html#ogiri）
window.addEventListener('hashchange', () => select(location.hash.slice(1), { push: false }));
select(location.hash.slice(1) || screens[0].id);

// ---- すごろく盤面の状態を画面間で中継する ----
// file://で開くとブラウザによってはlocalStorage/BroadcastChannel/storageイベントが
// 画面（iframe）間で共有・配信されないことがあるため、それらには頼らず、
// 親であるこの画面がpostMessageで直接橋渡しする（postMessageはorigin/file://の
// 制限を受けず、iframeの参照さえあれば必ず届く）。
let boardState = null; // { state, active, log }（banmen ⇔ バランスルーレットで共有）
window.addEventListener('message', (e) => {
  const msg = e.data;
  if (!msg || typeof msg !== 'object') return;
  if (msg.type === 'qol:board:save') {
    boardState = msg.payload;
    Object.values(frames).forEach((f) => {
      if (f.contentWindow && f.contentWindow !== e.source) {
        f.contentWindow.postMessage({ type: 'qol:board:update', payload: boardState }, '*');
      }
    });
  } else if (msg.type === 'qol:board:request') {
    if (e.source) e.source.postMessage({ type: 'qol:board:update', payload: boardState }, '*');
  }
});
</script>
</body>
</html>
